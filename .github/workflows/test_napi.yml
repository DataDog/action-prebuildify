name: Test (Node-API)

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 4 * * *'

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      min-node-version: 18
      napi: true
      node-gyp-build-major: 4
      package-manager: npm
      directory-path: ./test/napi
