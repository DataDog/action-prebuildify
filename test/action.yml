inputs:
  node:
    description: The version of Node to install for tests
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v7
      with:
        name: prebuilds
        path: ${{ env.DIRECTORY_PATH }}/prebuilds
    - run: chmod -R +x ./prebuilds
      shell: bash
      working-directory: ${{ env.DIRECTORY_PATH }}
    - run: |
        for attempt in 1 2 3 4 5; do
          if curl --proto '=https' --tlsv1.2 -sSf --output "$RUNNER_TEMP/rustup-init.sh" https://sh.rustup.rs; then
            break
          fi
          if [ "$attempt" = 5 ]; then
            exit 1
          fi
          sleep "$attempt"
        done
        sh "$RUNNER_TEMP/rustup-init.sh" -y
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      if: ${{ env.NAPI_RS == 'true' || env.RUST == 'true' }}
      shell: bash
    - uses: actions/setup-node@v5
      if: ${{ inputs.node != '' }}
      with:
        node-version: ${{ inputs.node }}
    - run: node -e "console.log(process.versions)"
      shell: bash
      working-directory: ${{ env.DIRECTORY_PATH }}
    - run: command -v yarn || npm install -g yarn@^1.22.22
      if: ${{ env.PACKAGE_MANAGER == 'yarn' }}
      shell: bash
    - run: $PACKAGE_MANAGER install --ignore-scripts
      shell: bash
      working-directory: ${{ env.DIRECTORY_PATH }}
    - run: $PACKAGE_MANAGER test
      shell: bash
      working-directory: ${{ env.DIRECTORY_PATH }}
